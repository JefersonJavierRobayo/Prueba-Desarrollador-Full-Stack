<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/catalog"></ion-back-button>
    </ion-buttons>
    <ion-title>Carrito de Compras</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Productos agregados -->
  <ion-list *ngIf="cartItems.length > 0; else emptyCart">
    <ion-item *ngFor="let item of cartItems">
      <ion-label>
        <h2>{{ item.product.name }}</h2>
        <p>Cantidad: {{ item.quantity }} x ${{ item.product.price | number }}</p>
        <p>Subtotal: ${{ (item.quantity * item.product.price) | number }}</p>
      </ion-label>
      <ion-button slot="end" color="danger" fill="clear" (click)="removeItem(item.product.id)">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Mensaje si el carrito está vacío -->
  <ng-template #emptyCart>
    <div class="ion-text-center ion-padding">
      <p>No hay productos en el carrito.</p>
      <ion-button routerLink="/catalog">Ir al Catálogo</ion-button>
    </div>
  </ng-template>

  <!-- Total de la compra y opción para finalizar -->
  <ion-card *ngIf="cartItems.length > 0">
    <ion-card-content>
      <h2><strong>Total: ${{ total | number }} COP</strong></h2>
      <ion-button expand="block" color="success" class="ion-margin-top" (click)="checkout()">
        Finalizar Compra
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
