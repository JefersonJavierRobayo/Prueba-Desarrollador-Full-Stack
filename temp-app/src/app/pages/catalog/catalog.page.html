<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Catálogo</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/cart">
        <ion-icon slot="icon-only" name="cart"></ion-icon>
      </ion-button>
      <ion-button routerLink="/points-calculator">
        <ion-icon slot="icon-only" name="calculator"></ion-icon>
      </ion-button>
      <ion-button *ngIf="authService.isAuthenticated()" (click)="authService.logout()">
        <ion-icon slot="icon-only" name="log-out"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="4" *ngFor="let product of products">
        <ion-card>
          <img [src]="product.image" [alt]="product.name" title="Imagen de producto" class="product-img" />
          <ion-card-header>
            <ion-card-title>{{ product.name }}</ion-card-title>
            <ion-card-subtitle>${{ product.price | number }} COP</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>{{ product.description }}</p>

            <!-- Bloque dinámico: Botón o Selector de cantidad -->
            <div class="ion-margin-top">
              <!-- Muestra el botón solo si la cantidad es 0, null o undefined -->
              <ion-button
                *ngIf="!product.quantity || product.quantity === 0"
                expand="block"
                color="primary"
                (click)="addToCart(product)">
                AGREGAR AL CARRITO
              </ion-button>

              <!-- Muestra el selector de cantidad cuando es mayor a 0 -->
              <div *ngIf="product.quantity && product.quantity > 0" class="quantity-control-container">
                <ion-button color="light" fill="clear" (click)="decreaseQuantity(product)">
                  <ion-icon name="remove-outline"></ion-icon>
                </ion-button>

                <span class="quantity-number">{{ product.quantity }}</span>

                <ion-button color="light" fill="clear" (click)="increaseQuantity(product)">
                  <ion-icon name="add-outline"></ion-icon>
                </ion-button>
              </div>
            </div>

          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
